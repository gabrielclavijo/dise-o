<body class="bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface antialiased">
  <div class="min-h-[1024px] flex flex-col justify-between max-w-lg mx-auto px-page-margin py-gutter-lg bg-light-surface dark:bg-dark-surface" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Barra superior mínima con logo y selector de tema -->
    <header class="flex items-center justify-between gap-gutter-md">
      <div class="flex items-center gap-gutter-sm">
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-md bg-light-primary-container dark:bg-dark-primary-container text-light-on-primary-container dark:text-dark-on-primary-container" aria-hidden="true">
          <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &#39;FILL&#39; 1;">bolt</span>

      </div>
      <button id="theme-toggle" data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Cambiar entre tema claro y oscuro" aria-pressed="false" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-light-surface-container dark:bg-dark-surface-container-high text-light-on-surface dark:text-dark-on-surface border border-light-outline-variant dark:border-dark-outline-variant transition-transform duration-state-change hover:scale-105 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary dark:focus-visible:ring-dark-primary">
        <span id="theme-icon" class="material-symbols-outlined text-[20px]" aria-hidden="true">dark_mode</span>
      </button>
    </header>

    <!-- Tarjeta principal de acceso -->
    <main class="flex flex-col gap-gutter-lg my-auto py-gutter-lg anim-fade-up">
      <div class="flex flex-col gap-gutter-xs">
        <h1 class="font-headline text-display-lg-mobile md:text-display-lg text-light-on-surface dark:text-dark-on-surface text-balance">
          Bienvenido de vuelta
        </h1>
        <p class="font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">
          Sincroniza tus entrenamientos y revisa tu estado físico al instante.
        </p>
      </div>

      <section aria-label="Formulario de inicio de sesión" class="flex flex-col gap-gutter-md p-gutter-lg rounded-xl bg-light-surface-container-lowest dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant">
        <!-- Acceso rápido OAuth -->
        <div class="grid grid-cols-2 gap-gutter-sm">
          <a href="../panel-escritorio/PanelEscritorio.html" class="inline-flex items-center justify-center gap-gutter-xs px-3 py-2.5 rounded-md bg-light-secondary-container dark:bg-dark-secondary-container text-light-on-secondary-container dark:text-dark-on-secondary-container font-label text-label-lg transition-transform duration-state-change hover:opacity-90 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary dark:focus-visible:ring-dark-primary">
            <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">sprint</span>
            <span>Strava</span>
          </a>
          <a href="../panel-escritorio/PanelEscritorio.html" class="inline-flex items-center justify-center gap-gutter-xs px-3 py-2.5 rounded-md bg-light-surface-container dark:bg-dark-surface-container-high border border-light-outline-variant dark:border-dark-outline-variant text-light-on-surface dark:text-dark-on-surface font-label text-label-lg transition-transform duration-state-change hover:border-light-primary dark:hover:border-dark-primary active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary dark:focus-visible:ring-dark-primary">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">account_circle</span>
            <span>Google</span>
          </a>
        </div>

        <div class="flex items-center gap-gutter-sm">
          <span class="h-px flex-1 bg-light-outline-variant dark:bg-dark-outline-variant"></span>
          <span class="font-label text-label-md text-light-on-surface-variant dark:text-dark-on-surface-variant">o con tu correo</span>
          <span class="h-px flex-1 bg-light-outline-variant dark:bg-dark-outline-variant"></span>
        </div>

        <form id="login-form" class="flex flex-col gap-gutter-md">
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-lg text-light-on-surface dark:text-dark-on-surface">Correo electrónico</span>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-[20px] text-light-on-surface-variant dark:text-dark-on-surface-variant" aria-hidden="true">mail</span>
              <input type="email" required placeholder="sofia@entreno.run" autocomplete="email" class="w-full pl-10 pr-gutter-md py-2.5 rounded-md bg-light-surface-container-lowest dark:bg-dark-surface-container border border-light-outline-variant dark:border-dark-outline-variant font-body text-body-lg text-light-on-surface dark:text-dark-on-surface focus:outline-none focus:ring-2 focus:ring-light-primary dark:focus:ring-dark-primary">
            </div>
          </label>

          <label class="flex flex-col gap-gutter-xs">
            <div class="flex items-center justify-between gap-2">
              <span class="font-label text-label-lg text-light-on-surface dark:text-dark-on-surface">Contraseña</span>
              <a href="#recuperar" class="font-label text-label-md text-light-primary dark:text-dark-primary hover:underline">¿Olvidaste tu clave?</a>
            </div>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-[20px] text-light-on-surface-variant dark:text-dark-on-surface-variant" aria-hidden="true">lock</span>
              <input id="login-pass" type="password" required placeholder="••••••••" autocomplete="current-password" class="w-full pl-10 pr-11 py-2.5 rounded-md bg-light-surface-container-lowest dark:bg-dark-surface-container border border-light-outline-variant dark:border-dark-outline-variant font-body text-body-lg text-light-on-surface dark:text-dark-on-surface focus:outline-none focus:ring-2 focus:ring-light-primary dark:focus-visible:ring-dark-primary">
              <button id="toggle-pass" type="button" aria-label="Mostrar u ocultar contraseña" class="absolute right-2.5 p-1 rounded-sm text-light-on-surface-variant dark:text-dark-on-surface-variant hover:text-light-on-surface dark:hover:text-dark-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary dark:focus-visible:ring-dark-primary">
                <span id="pass-icon" class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility</span>
              </button>
            </div>
          </label>

          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3 rounded-md bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary font-label text-label-lg transition-transform duration-state-change hover:opacity-90 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary dark:focus-visible:ring-dark-primary">
            <span data-design-text-token="label-lg">Entrar a Entreno</span>
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_forward</span>
          </button>
        </form>
      </section>

      <p class="text-center font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">
        ¿Primera vez aquí?
        <a href="../registro/CrearCuenta.html" class="font-label text-label-lg text-light-primary dark:text-dark-primary hover:underline">Crear cuenta</a>
      </p>
    </main>

    <footer class="text-center font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">
      Tus datos médicos nunca salen de tu dispositivo.
    </footer>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var icon = document.getElementById('theme-icon');
      function applyTheme(dark) {
        root.classList.toggle('dark', dark);
        if (btn) btn.setAttribute('aria-pressed', String(dark));
        if (icon) icon.textContent = dark ? 'light_mode' : 'dark_mode';
      }
      try { if (localStorage.getItem('pulso_theme') === 'dark') applyTheme(true); } catch (e) {}
      if (btn) {
        btn.addEventListener('click', function () {
          var next = !root.classList.contains('dark');
          applyTheme(next);
          try { localStorage.setItem('pulso_theme', next ? 'dark' : 'light'); } catch (e) {}
        });
      }

      var passInput = document.getElementById('login-pass');
      var togglePass = document.getElementById('toggle-pass');
      var passIcon = document.getElementById('pass-icon');
      togglePass.addEventListener('click', function () {
        var isPwd = passInput.type === 'password';
        passInput.type = isPwd ? 'text' : 'password';
        passIcon.textContent = isPwd ? 'visibility_off' : 'visibility';
      });

      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = '../estado-fisico/EstadoFisico.html';
      });
    })();
  </script>
