    (function () {
      var root = document.documentElement, btn = document.getElementById('theme-toggle'), icon = document.getElementById('theme-icon');
      function applyTheme(d) { root.classList.toggle('dark', d); if (btn) btn.setAttribute('aria-pressed', String(d)); if (icon) icon.textContent = d ? 'light_mode' : 'dark_mode'; }
      try { if (localStorage.getItem('pulso_theme') === 'dark') applyTheme(true); } catch (e) {}
      if (btn) btn.addEventListener('click', function () { var n = !root.classList.contains('dark'); applyTheme(n); try { localStorage.setItem('pulso_theme', n ? 'dark' : 'light'); } catch (e) {} });
      try {
        var a = localStorage.getItem('pulso_user_avatar'), n = localStorage.getItem('pulso_user_name');
        if (a) document.querySelectorAll('[data-user-avatar]').forEach(function (i) { i.src = a; });
        if (n) document.querySelectorAll('[data-user-name]').forEach(function (e) { e.textContent = n; });
      } catch (e) {}
    })();
